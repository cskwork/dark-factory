# Copy to factory.toml. Relative project_root starts at this file's directory;
# state_dir and repos start at project_root. Python 3.11+, Bash, and Git required.
project_root = "."
state_dir = ".factory"
repos = "services/*"
key_pattern = '[A-Z][A-Z0-9]+-\d+'
key_marker = "[{key}]"
base_branch = "origin/main"
branch_prefixes = ["fix/", "feat/"]
duplicate_window_seconds = 1500
lock_stale_seconds = 10800
command_timeout_seconds = 300
launch_timeout_seconds = 60
worker_timeout_seconds = 5500
runbook = "templates/RUNBOOK.template.md"

[worker]
# Tell confirm-dialog hooks that nobody is attending. Default: an empty map.
env = { BLAST_RADIUS_UNATTENDED = "1" }

[lessons]
escalate_count = 3
window_days = 14
cooldown_days = 7

# Owner liveness is opt-in for existing configurations. Both switches can also
# be disabled by writing off to state_dir/liveness or 0 to state_dir/drain.
[liveness]
enabled = true

[drain]
enabled = true

# Optional: a provider's content filter refusing the task is not a failure of the work.
# When every pattern (Python regex) matches the worker result or stderr, check-result
# returns failureType=model-refusal and retryWorker; the orchestrator retries that unit
# once with this worker role. A failed retry is human-risk.
[drain.model_refusal]
patterns = ["OUTPUT_SCHEMA_FAILED", "(?i)cybersecurity"]
retry_worker = "fallback"

# TOML insertion order is promotion order. Never infer approval from this order.
[env_branches]
dev = "origin/dev"
stg = "origin/stg"
prd = "origin/main"

# Commands are argv arrays (recommended) or shlex-quoted strings, never shell.
# Placeholder expansion happens after splitting, preserving spaces in arguments.
# Literal braces in commands must be doubled: {{ and }}.
[launcher]
# Scope the list to this factory, including workers and archived agents. Choose a
# distinct factory label for every state directory. Never use status-only cleanup.
list_cmd = ["paseo", "agent", "ls", "--json", "-a", "--label", "factory=example"]
inspect_cmd = ["paseo", "agent", "inspect", "{id}", "--json"]
archive_cmd = ["paseo", "agent", "archive", "{id}"]
# Optional adapter: cancel only the exact agent, then inspect/list to confirm it stopped.
cancel_cmd = ["paseo", "stop", "{id}", "--json"]
logs_cmd = ["paseo", "agent", "logs", "{id}"]
run_label_args = ["--label", "run={token}"]
key_label_args = ["--label", "key={key}"]
attempt_label_args = ["--label", "attempt={attempt}"]
# Adapt these flags if your runner uses a different way to pass agent environment.
env_args = ["--env", "{name}={value}"]
parent_env_keys = ["PASEO_AGENT_ID", "PASEO_WORKSPACE_ID"]
command = ["paseo", "run", "--provider", "{provider}", "--model", "{model}", "--thinking", "{thinking}", "--mode", "{mode}", "--cwd", "{cwd}", "--label", "factory=example", "--label", "role={role}"]

# Dotted JSON field paths; omit list_field for a raw list or {"agents": [...]}.
[launcher.fields]
id = "id"
status = "status"
archived = "archived"
labels = "labels"
key = "key"
inspect_status = "Status"
inspect_archived = "Archived"

# Map external status strings to running, idle, or closed.
[launcher.status_map]
running = "running"
idle = "idle"
closed = "closed"
finished = "closed"
completed = "closed"

[roles.waker]
provider = "codex"
model = "gpt-6-luna"
thinking = "low"
mode = "read-only"

[roles.orchestrator]
provider = "claude"
model = "claude-opus-5-5"
thinking = "high"
mode = "default"

[roles.workers.builder]
provider = "codex"
model = "gpt-6.1-sol"
thinking = "high"
mode = "workspace-write"

[roles.workers.reviewer]
provider = "claude"
model = "claude-opus-5-5"
thinking = "medium"
mode = "read-only"

[roles.workers.fallback]
provider = "claude"
model = "claude-opus-5-5"
thinking = "high"
mode = "default"

[intake]
# Adapter prints exactly one JSON object to stdout; see the runbook contract.
scan_cmd = ["python3", "adapters/intake.py"]
# Total wall seconds for one scan including its retry. Keep it below the tick budget:
# a scan killed by the tick cannot record its own failure until the next scan.
scan_budget_seconds = 300

# Optional queue/tracker reconciliation. The intake adapter may add
# "queueStatuses":{"PROJ-123":"Released"} for keys already in queue.json. Every tick the
# guard removes items whose status maps to done or whose stage is a done stage, and turns
# human-risk into reporter when the status maps to awaiting-reporter. Keys owned by another
# run are left alone. Unmapped statuses change nothing; omit the table to disable.
[reconcile]
done_stages = ["shipped"]
[reconcile.status_map]
"Released" = "done"
"Release verified" = "done"
"Staging verified" = "done"
"QA requested" = "awaiting-reporter"
"Staging QA requested" = "awaiting-reporter"

# Worktrees the orchestrator may remove from a worker's cleanup:<path> artifacts with
# python3 -m factory.cleanup --config CONFIG --result RESULT --execute. Roots are relative
# to project_root; a target outside them is kept. A promoted merge branch (tip contained in
# an env_branches ref) is deleted with its worktree.
[cleanup]
roots = ["worktrees"]
merge_branch_prefix = "merge/"

[notify]
# Optional trusted argv adapter. Empty disables notifications; no shell is used.
cmd = [] # e.g. ["python3", "adapters/notify.py", "{message}"]

# Planner-readable ticket comments (factory.comment_check). Defaults cover English
# developer terms; add locale terms the planners would not read.
[comments]
max_chars = 800
terms = [] # e.g. ["쿼리", "커밋", "빌드", "브랜치"]
allow = []
[comments.patterns] # name = regex, reported like built-in rules
# repository = '\bmy-service-(?:api|web)\b'

[triage]
mode = "shadow"
classifier_cmd = [] # Optional adapter reads {events:[...]} on stdin, returns predictions.
confidence_threshold = 0.9
timeout_seconds = 45

[ci]
view_cmd = ["python3", "adapters/ci.py", "--job", "{job}", "--build", "{build}", "--context", "{context}"]
[ci.fields]
status = "status"
result = "result"
commit = "commit"

# Each probe exits 0 ready, a configured human exit code for human action,
# otherwise unavailable. Probe stdout/stderr is never copied to verifier JSON.
[preflight.probes.network]
cmd = ["python3", "adapters/probe.py", "network"]
human_exit_codes = [10]
human_action = "Connect the required network"

[preflight.probes.service]
requires = ["network"]
cmd = ["python3", "adapters/probe.py", "service"]
human_exit_codes = [10]

# Optional listing probe: success requires at least one nonblank line, with every
# line matching the full regex. Output stays out of verifier JSON.
# [preflight.probes.resources]
# cmd = ["python3", "adapters/list_resources.py"]
# stdout_pattern = 'resource/[a-z0-9-]+'

# Where a human decides: "html" (default) opens a local decision page with one-time-token
# buttons. "app", "tui" and "web" are views of the sdlc-kit to-do list (~/.sdlc/todo.md;
# SDLC_TODO overrides the file, SDLC_KIT the kit, default ~/.agents/skills/sdlc-kit; needs
# Node 18+). With a to-do surface no page or server starts: each decision is a waiting
# "[decision D<n>]" item and the human's reply is the decision ("approve", a number, an option
# id or label, or "hold"). notify.cmd alerts also update one "[factory alert]" item.
[decisions]
surface = "html"

[decisions.approval]
on_approve = ["python3", "adapters/approve.py", "--key", "{key}", "--decision", "{decision_id}", "--note", "{note}"]

[decisions.sql]
# Supply your own importable DB-API module. No database driver is bundled.
connector_module = "example_connector"
allowed_config_names = ["sandbox"]
expected_host_prefixes = ["sandbox-"]
forbidden_host_substrings = ["prd", "prod", "production"]
host_query = "SELECT @@hostname"
[decisions.sql.configs.sandbox]
# Connector-specific connect(**kwargs); keep credentials outside version control.
database = "sandbox"

# Read-only verification before approval creation; no migration DDL is executed.
[migrations]
repo = "services/example"
glob = "docs/db/migration/*.sql"
base = "origin/stg"
head = "HEAD"
sql_config = "sandbox"
expect_host = "sandbox-"
default_schema = "sandbox"
